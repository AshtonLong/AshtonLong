      <animateTransform attributeName="transform" type="translate" values="0 0;-40 50;0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle class="p" cx="399.17" cy="85.25" r="2.11" fill="#3fb950" style="animation-duration:7.51s;animation-delay:-7.5s"/><circle class="p" cx="694.38" cy="312.91" r="1.5" fill="#bc8cff" style="animation-duration:7.6s;animation-delay:-5.85s"/><circle class="p" cx="133.41" cy="167.36" r="2.36" fill="#58a6ff" style="animation-duration:7.87s;animation-delay:-3.13s"/><circle class="p" cx="687.9" cy="159" r="2.57" fill="#3fb950" style="animation-duration:7.33s;animation-delay:-12.02s"/><circle class="p" cx="507.82" cy="202.21" r="2" fill="#58a6ff" style="animation-duration:10.92s;animation-delay:-9.55s"/><circle class="p" cx="693.02" cy="231.67" r="1.72" fill="#58a6ff" style="animation-duration:10.83s;animation-delay:-0.88s"/><circle class="p" cx="735.67" cy="188.92" r="1.94" fill="#ffffff" style="animation-duration:12.44s;animation-delay:-6.52s"/><circle class="p" cx="442.2" cy="114.53" r="1.45" fill="#3fb950" style="animation-duration:12.46s;animation-delay:-1.15s"/><circle class="p" cx="628.72" cy="302.54" r="2.22" fill="#58a6ff" style="animation-duration:9.02s;animation-delay:-13.72s"/><circle class="p" cx="613.6" cy="89.49" r="1.68" fill="#58a6ff" style="animation-duration:13.53s;animation-delay:-5.9s"/><circle class="p" cx="901.61" cy="211.91" r="2.43" fill="#ffffff" style="animation-duration:9.2s;animation-delay:-9.73s"/><circle class="p" cx="691.08" cy="176.86" r="2.38" fill="#58a6ff" style="animation-duration:13.61s;animation-delay:-6.64s"/><circle class="p" cx="99.16" cy="250.45" r="2.11" fill="#3fb950" style="animation-duration:13.95s;animation-delay:-11.51s"/><circle class="p" cx="846.96" cy="306.11" r="1.69" fill="#58a6ff" style="animation-duration:13.58s;animation-delay:-4.98s"/><circle class="p" cx="592.81" cy="105.46" r="1.6" fill="#ffffff" style="animation-duration:12.17s;animation-delay:-5.57s"/><circle class="p" cx="121.86" cy="174.76" r="1.97" fill="#3fb950" style="animation-duration:13.18s;animation-delay:-11.47s"/><circle class="p" cx="835.29" cy="