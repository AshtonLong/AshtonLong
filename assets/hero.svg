</defs>

<g clip-path="url(#frame)">
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gm)"/>

  <g filter="url(#blur)">
