    <text x="662" y="106" class="mono" textLength="67.2" clip-path="url(#cl0)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text><text x="662" y="128" class="mono" fill="#8b949e" textLength="403.2" opacity="0">ashton, 4th-year CS co-op @ University of Guelph<animate attributeName="opacity" from="0" to="1" begin="1.88s" dur="0.18s" fill="freeze"/></text><text x="662" y="150" class="mono" textLength="142.8" clip-path="url(#cl2)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat current.txt</tspan></text><text x="662" y="172" class="mono" fill="#8b949e" textLength="327.6" opacity="0">Software Developer (contract) @ ScanAir<animate attributeName="opacity" from="0" to="1" begin="3.79s" dur="0.18s" fill="freeze"/></text><text x="662" y="194" class="mono" fill="#8b949e" textLength="403.2" opacity="0">FastAPI + React/TS + Mapbox GL + Python geometry<animate attributeName="opacity" from="0" to="1" begin="3.94s" dur="0.18s" fill="freeze"/></text><text x="662" y="216" class="mono" textLength="126" clip-path="url(#cl5)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">ls ~/projects</tspan></text><text x="662" y="238" class="mono" fill="#8b949e" textLength="344.4" opacity="0">AnkiGPT/   AI-Tutor-Bot/   VCard-Manager/<animate attributeName="opacity" from="0" to="1" begin="5.74s" dur="0.18s" fill="freeze"/></text><text x="662" y="260" class="mono" textLength="117.6" clip-path="url(#cl7)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">echo $STATUS</tspan></text><text x="662" y="282" class="mono" fill="#8b949e" textLength="319.2" opacity="0">open to software developer co-op roles<animate attributeName="opacity" from="0" to="1" begin="7.49s" dur="0.18s" fill="freeze"/></text><text x="662" y="304" class="mono" fill="#3fb950" opacity="0">$<animate attributeName="opacity" from="0" to="1" begin="7.73s" dur="0.1s" fill="freeze"/></text>
